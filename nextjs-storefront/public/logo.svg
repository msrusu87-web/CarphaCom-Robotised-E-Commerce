<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 48" fill="none">
  <!-- Robot head icon -->
  <g transform="translate(4, 4)">
    <!-- Antenna -->
    <line x1="20" y1="0" x2="20" y2="6" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="20" cy="0" r="2.5" fill="#00d4ff"/>
    <!-- Head -->
    <rect x="6" y="6" width="28" height="22" rx="4" fill="#1a1a2e" stroke="#00d4ff" stroke-width="1.5"/>
    <!-- Eyes -->
    <circle cx="15" cy="16" r="3.5" fill="#00d4ff" opacity="0.9"/>
    <circle cx="25" cy="16" r="3.5" fill="#00d4ff" opacity="0.9"/>
    <circle cx="15" cy="16" r="1.5" fill="#ffffff"/>
    <circle cx="25" cy="16" r="1.5" fill="#ffffff"/>
    <!-- Mouth / speaker grille -->
    <line x1="14" y1="23" x2="26" y2="23" stroke="#00d4ff" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <!-- Body -->
    <rect x="10" y="30" width="20" height="10" rx="2" fill="#1a1a2e" stroke="#00d4ff" stroke-width="1.2"/>
    <!-- Chest indicator -->
    <circle cx="20" cy="35" r="2" fill="#00ff88" opacity="0.8"/>
    <!-- Arms -->
    <line x1="8" y1="32" x2="2" y2="37" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="32" y1="32" x2="38" y2="37" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Grip circles -->
    <circle cx="1" cy="38" r="1.5" fill="#00d4ff" opacity="0.7"/>
    <circle cx="39" cy="38" r="1.5" fill="#00d4ff" opacity="0.7"/>
  </g>
  <!-- Text: CarphaCom -->
  <text x="52" y="28" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#ffffff" letter-spacing="-0.5">
    <tspan fill="#00d4ff">Carpha</tspan><tspan fill="#ffffff">Com</tspan>
  </text>
  <!-- Tagline -->
  <text x="52" y="42" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="400" font-size="9" fill="#888888" letter-spacing="2.5" text-transform="uppercase">
    ROBOTISED E-COMMERCE
  </text>
</svg>
